name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile scanner source
        run: python -c "import py_compile; py_compile.compile('mobile-hacked-checker.python', doraise=True)"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
